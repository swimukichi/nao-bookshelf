name: Post novels

# ① note に公開された話を取り込み、カクヨム・なろう・エブリスタへ投稿/予約する。
#    (note への投稿は PC 側の仕組みが担当)
# ② このリポジトリで書いた原稿は、note を含めて各サイトへ予約投稿する。

on:
  schedule:
    - cron: "10 * * * *"
  push:
    branches: [main]
    paths:
      - "publisher/works/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe=画面を調べる / dry-run=入力のみ / post=投稿・予約まで実行"
        type: choice
        options: [probe, dry-run, post]
        default: probe
      platform:
        description: "note / kakuyomu / narou / estar(空なら全部)"
        required: false
        default: ""
      target:
        description: "作品フォルダ名 または 作品/話(例: meibo/10)。空なら全部"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import published episodes from note
        run: python3 scripts/sync_from_note.py

      - name: Build publish kit
        run: python3 scripts/build_publish_kit.py

      - name: Check for episodes to post
        id: check
        run: |
          python3 scripts/auto_post.py --check \
            --mode "${{ github.event.inputs.mode || 'post' }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --target "${{ github.event.inputs.target }}"

      - name: Install Playwright
        if: steps.check.outputs.jobs != '0'
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Post / schedule to other sites
        if: steps.check.outputs.jobs != '0'
        env:
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          KAKUYOMU_STORAGE_STATE: ${{ secrets.KAKUYOMU_STORAGE_STATE }}
          NAROU_STORAGE_STATE: ${{ secrets.NAROU_STORAGE_STATE }}
          ESTAR_STORAGE_STATE: ${{ secrets.ESTAR_STORAGE_STATE }}
        run: |
          python3 scripts/auto_post.py \
            --mode "${{ github.event.inputs.mode || 'post' }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --target "${{ github.event.inputs.target }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-post-screenshots
          path: publisher/poster/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit imported episodes and state
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- publisher)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publisher/works publisher/output publisher/state.json
          git commit -m "chore: import note episodes and record reposts"
          git pull --rebase origin main
          git push
