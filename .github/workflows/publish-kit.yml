name: Build publish kit

on:
  push:
    branches: [main]
    paths:
      - "publisher/works/**"
      - "publisher/config.json"
      - "scripts/build_publish_kit.py"
      - "data/latest.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-kit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build publish kit from manuscripts
        run: python3 scripts/build_publish_kit.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- publisher/output)" ]; then
            echo "No changes to publisher/output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publisher/output
          git commit -m "chore: rebuild publish kit"
          git pull --rebase origin main
          git push
